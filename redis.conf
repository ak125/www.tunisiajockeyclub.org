# Configuration Redis pour Tunisia Jockey Club

# Bind sur toutes les interfaces pour Docker
bind 0.0.0.0

# Port par défaut
port 6379

# Timeout des connexions inactives (0 = pas de timeout)
timeout 0

# Keepalive TCP
tcp-keepalive 300

# Logs
loglevel notice
logfile ""

# Base de données (16 databases par défaut)
databases 16

# Sauvegarde automatique
save 900 1
save 300 10
save 60 10000

# Compression
rdbcompression yes
rdbchecksum yes

# Nom du fichier RDB
dbfilename dump.rdb

# Répertoire de travail
dir /data

# Mémoire maximale (optionnel)
# maxmemory 128mb
# maxmemory-policy allkeys-lru

# Sécurité (optionnel - décommentez si nécessaire)
# requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81

# Performance
tcp-backlog 511
timeout 0

# Désactiver les commandes dangereuses en production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""
